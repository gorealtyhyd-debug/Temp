<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Srinivasa Ramanujan Foundation">
  <title>Srinivasa Ramanujan Foundation</title>
  <!-- SRF wordmark -->
  <g fill="#121212" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="70" y="118" font-size="118" letter-spacing="-2">S</text>
    <!-- R with gold counter -->
    <text x="168" y="118" font-size="118" letter-spacing="-2">R</text>
    <text x="292" y="118" font-size="118" letter-spacing="-2">F</text>
  </g>
  <!-- Gold sun inside R counter -->
  <circle cx="248" cy="62" r="22" fill="#C9A227"/>
  <!-- Spark rays -->
  <g stroke="#121212" stroke-width="4" stroke-linecap="round">
    <line x1="276" y1="38" x2="292" y2="24"/>
    <line x1="286" y1="52" x2="308" y2="46"/>
    <line x1="288" y1="66" x2="310" y2="70"/>
    <line x1="280" y1="78" x2="298" y2="92"/>
  </g>
  <!-- 1729 badge -->
  <rect x="198" y="128" width="110" height="36" rx="3" fill="#121212"/>
  <text x="253" y="154" text-anchor="middle" fill="#C9A227" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">1729</text>
  <!-- Divider -->
  <line x1="48" y1="196" x2="592" y2="196" stroke="#121212" stroke-width="3"/>
  <!-- Foundation name -->
  <text x="320" y="238" text-anchor="middle" fill="#121212" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3.5">SRINIVASA RAMANUJAN FOUNDATION</text>
</svg>
