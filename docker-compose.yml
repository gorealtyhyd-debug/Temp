services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srf
      POSTGRES_PASSWORD: srf_secure_password
      POSTGRES_DB: srf_olympiad
    ports:
      - "5432:5432"
    volumes:
      - srf_pg_data:/var/lib/postgresql/data

volumes:
  srf_pg_data:
